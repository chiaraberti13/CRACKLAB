name: Verifiable Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, attest and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: npm

      - name: Require a tagged commit from main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Validate tag, manifest and changelog
        run: |
          mkdir -p release
          node scripts/release-metadata.mjs --tag "$GITHUB_REF_NAME" --notes release/RELEASE_NOTES.md

      - name: Bootstrap lockfile policy
        run: node --test scripts/verify-lockfile.test.mjs && node scripts/verify-lockfile.mjs

      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify source and build
        run: npm run verify

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end and accessibility suite
        run: npm run test:e2e

      - name: Retain end-to-end evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-${{ github.ref_name }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 90

      - name: Audit runtime and complete dependency graph
        run: |
          npm run audit:runtime
          npm run audit:full

      - name: Package the deterministic application archive
        run: |
          tar --sort=name --owner=0 --group=0 --numeric-owner \
            --mtime="@${SOURCE_DATE_EPOCH:-0}" \
            -czf "release/cracklab-${GITHUB_REF_NAME}.tar.gz" -C dist .
          ( cd release && sha256sum "cracklab-${GITHUB_REF_NAME}.tar.gz" > SHA256SUMS )
        env:
          SOURCE_DATE_EPOCH: 0

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --title "$GITHUB_REF_NAME"
          --notes-file release/RELEASE_NOTES.md
          "release/cracklab-${GITHUB_REF_NAME}.tar.gz"
          "release/SHA256SUMS"

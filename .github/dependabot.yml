version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # typescript-eslint peer-requires typescript <6.1.0, so TypeScript 7 breaks
      # `npm ci` with ERESOLVE. Hold the major until typescript-eslint supports TS 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      # One coherent lockfile update per week instead of a flood of single bumps.
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
